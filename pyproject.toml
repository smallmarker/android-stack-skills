[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-stack-skills"
version = "0.3.0rc1"
description = "Deterministic Android stacks powered by Agent Skills"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "Jinja2>=3.1,<4", "packaging>=24", "jsonschema>=4.23,<5"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
android-stack = "android_stack_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
android_stack_skills = ["data/**/*", "data/project-templates/.gitignore.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
