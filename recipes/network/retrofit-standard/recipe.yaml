id: retrofit-standard
name: Retrofit Standard
version: 0.3.0
category: network
description: Retrofit suspend calls with typed results and safe OkHttp authentication.
source:
  repository: https://github.com/square/retrofit
  revision: 3.0.0
  license: Apache-2.0
  copied_source: []
requirements:
  language: kotlin
  gradle_dsl: kotlin
  min_sdk: 21
dependencies:
  - {module: 'com.squareup.retrofit2:retrofit', version: '3.0.0', configuration: implementation}
  - {module: 'com.squareup.retrofit2:converter-gson', version: '3.0.0', configuration: implementation}
  - {module: 'com.squareup.okhttp3:okhttp', version: '4.12.0', configuration: implementation}
  - {module: 'com.google.code.gson:gson', version: '2.13.1', configuration: implementation}
  - {module: 'org.jetbrains.kotlinx:kotlinx-coroutines-android', version: '1.10.2', configuration: implementation}
  - {module: 'com.squareup.okhttp3:mockwebserver', version: '4.12.0', configuration: testImplementation}
  - {module: 'com.squareup.okhttp3:okhttp-tls', version: '4.12.0', configuration: testImplementation}
  - {module: 'junit:junit', version: '4.13.2', configuration: testImplementation}
features: [okhttp, gson, result-wrapper, error-mapping, response-boundary, origin-bound, one-shot-writes, optional-hilt]
variables:
  package: detected namespace
files:
  - {template: templates/Network.kt.j2, path: '{{ main_source }}/{{ package_path }}/network/Network.kt'}
  - {template: templates/NetworkModule.kt.j2, path: '{{ main_source }}/{{ package_path }}/network/NetworkModule.kt', when: hilt}
  - {template: templates/NetworkTest.kt.j2, path: '{{ test_source }}/{{ package_path }}/network/NetworkTest.kt'}
  - {template: templates/NetworkSecurityTest.kt.j2, path: '{{ test_source }}/{{ package_path }}/network/NetworkSecurityTest.kt'}
  - {template: templates/Usage.md.j2, path: '{{ module }}/android-stack/network/Usage.md'}
integration: {supports_existing_project: true, idempotent: true, strategy: append-dependency-block}
validation: [schema, owned-file-hashes, gradle-build, unit-test]
